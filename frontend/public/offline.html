<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0284c7" />
    <title>Offline | Wash &amp; Refill</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: #f0f9ff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #111827;
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        padding: 28px 24px;
        text-align: center;
      }
      img { width: 88px; height: 88px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { font-size: 14px; color: #6b7280; line-height: 1.5; margin: 0 0 20px; }
      button {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        background: #0284c7;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #0369a1; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="Wash &amp; Refill Laundry" />
      <h1>You're offline</h1>
      <p>
        Wash &amp; Refill needs an internet connection to load orders, supplies and sales.
        Check your Wi-Fi or mobile data, then try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
